// Definiamo la classe del Pipeline *prima* della configurazione
class GlowPostFX extends Phaser.Renderer.WebGL.Pipelines.PostFXPipeline {
    constructor(game) {
        super({
            game,
            name: 'GlowPostFX',
            fragShader: `
            precision mediump float;
            uniform sampler2D uMainSampler;
            varying vec2 outTexCoord;
            uniform vec2 uTextureSize;
            uniform float uDistance;
            uniform float uOuterStrength;
            uniform vec4 uGlowColor;

            void main() {
                vec4 texel = texture2D(uMainSampler, outTexCoord);
                vec3 glow = vec3(0.0);
                float step = 1.0 / max(uTextureSize.x, uTextureSize.y);
                float count = 0.0;

                for (float y = -2.0; y <= 2.0; y++) {
                    for (float x = -2.0; x <= 2.0; x++) {
                        vec2 dist = vec2(x, y) * uDistance * step;
                        vec4 c = texture2D(uMainSampler, outTexCoord + dist);
                        float a = c.a * max(0.0, 1.0 - length(vec2(x, y)) / 3.0);
                        glow += uGlowColor.rgb * a;
                        count += a;
                    }
                }
                if (count > 0.0) {
                    glow /= count;
                }
                
                vec4 finalColor = vec4(mix(texel.rgb, glow, uOuterStrength * (1.0 - texel.a)), max(texel.a, glow.x * uOuterStrength));
                gl_FragColor = finalColor;
            }
            `
        });
        this.distance = 4.0;
        this.outerStrength = 2.0;
        this.glowColor = new Phaser.Display.Color(255, 255, 255);
    }
}

// Funzione utilitaria per controllare in sicurezza il pipeline
function canUseGlow(scene) {
    // Controllo WebGL *e* specifica disponibilità del pipeline registrato
    return scene.renderer.type === Phaser.WEBGL && 
           scene.renderer.pipelines && 
           scene.renderer.pipelines.has('GlowFX');
}

// ---------- AUDIO PROCEDURALE (WebAudio, nessun asset) ----------
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (audioCtx) startMusic();
}

function beep(freq, dur, type, vol, slideTo) {
    if (!audioCtx) return;
    let o = audioCtx.createOscillator();
    let g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
}

function sfxJump(powerful) { beep(powerful ? 300 : 240, 0.12, 'square', 0.05, powerful ? 640 : 480); }

}

// ---------- COLONNA SONORA 8-BIT (sequencer chiptune) ----------
// Progressione: Am - F - C - G, 4 battute da 16 sedicesimi, 132 BPM
let musicOn = true;
let musicTimer = null;
let musicGain = null;
let nextNoteTime = 0;
let noiseBuffer = null;
const BPM = 132;
const STEP_DUR = 60 / BPM / 4; // durata di un sedicesimo

function noteFreq(n) {
    const SEMI = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
    let m = n.match(/^([A-G]#?)(\d)$/);
    return 440 * Math.pow(2, (SEMI[m[1]] + (parseInt(m[2]) - 4) * 12 - 9) / 12);
}

// Triadi per gli arpeggi in stile NES (chorus/special)
const CHORD_TONES = {
    A2: ['A3', 'C4', 'E4'],
    F2: ['F3', 'A3', 'C4'],
    C3: ['C4', 'E4', 'G4'],
    G2: ['G3', 'B3', 'D4']
};

// Sezione A (verse): melodia pentatonica rilassata
const PATTERN_A = {
    len: 64,
    lead: [
        'A4', null, 'C5', null, 'E5', null, 'D5', null, 'C5', null, 'A4', null, 'G4', null, 'A4', null,
        'F4', null, 'A4', null, 'C5', null, 'A4', null, 'G4', null, 'F4', null, 'E4', null, 'G4', null,
        'E4', null, 'G4', null, 'C5', null, 'G4', null, 'E5', null, 'D5', null, 'C5', null, 'D5', null,
        'G4', null, 'B4', null, 'D5', null, 'B4', null, 'G4', null, 'A4', null, 'B4', null, 'D5', null
    ],
    chords: ['A2', 'F2', 'C3', 'G2'],
    arp: false,
    hats: 2
};

// Sezione B (chorus): melodia più alta e orecchiabile + arpeggio di triadi
const PATTERN_B = {
    len: 64,
    lead: [
        'E5', null, 'E5', null, 'C5', null, 'E5', null, 'A5', null, 'G5', null, 'E5', null, 'C5', null,
        'F5', null, 'E5', null, 'C5', null, 'A4', null, 'C5', null, 'D5', null, 'E5', null, 'F5', null,
        'G5', null, 'E5', null, 'C5', null, 'E5', null, 'G5', null, 'E5', null, 'D5', null, 'C5', null,
        'D5', null, 'E5', null, 'D5', null, 'B4', null, 'G4', null, 'B4', null, 'D5', null, 'G5', null
    ],
    chords: ['A2', 'F2', 'C3', 'G2'],
    arp: true,
    hats: 2
};

// Sezione S (special / boss): riff veloce e teso, si attiva alle milestone di zona
const PATTERN_S = {
    len: 32,
    lead: [
        'A4', 'A4', 'C5', 'A4', 'E5', 'A4', 'G5', 'E5', 'F5', null, 'E5', null, 'D5', null, 'C5', null,
        'B4', 'B4', 'D5', 'B4', 'F5', 'B4', 'A5', 'F5', 'E5', 'D5', 'C5', 'B4', 'A4', null, null, null
    ],
    chords: ['A2', 'G2'],
    arp: true,
    hats: 1
};

const PATTERNS = { A: PATTERN_A, B: PATTERN_B, S: PATTERN_S };
let songQueue = ['A', 'A', 'B', 'B']; // struttura NES: verse x2 + chorus x2
let queuePos = 0;
let sectionStep = 0;
let specialQueued = false;

function musicNote(freq, t, dur, type, vol) {
    if (!audioCtx) return;
    let o = audioCtx.createOscillator();
    let g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur);
}

function musicHat(t, vol) {
    if (!audioCtx || !noiseBuffer) return;
    let src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    let g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    let f = audioCtx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 7000;
    src.connect(f); f.connect(g); g.connect(musicGain);
    src.start(t); src.stop(t + 0.05);
}

function scheduleStep(s, t) {
    let id = songQueue[queuePos];
    let p = PATTERNS[id];

    // Lead (square)
    let lead = p.lead[s];
    if (lead) musicNote(noteFreq(lead), t, STEP_DUR * (id === 'S' ? 1.2 : 1.8), 'square', 0.045);

    // Arpeggio di triade sui sedicesimi (sezione chorus/special)
    let bar = Math.floor(s / 16);
    let rootName = p.chords[bar];
    if (p.arp) {
        musicNote(noteFreq(CHORD_TONES[rootName][s % 3]), t, STEP_DUR * 0.9, 'triangle', 0.03);
    }

    // Basso (triangle): root sui quarti (martellante nella sezione special)
    if (s % 4 === 0 || (id === 'S' && s % 2 === 0)) {
        let root = noteFreq(rootName);
        let f = (s % 16 === 8) ? root * 2 : root; // salto d'ottava sul 3° tempo
        musicNote(f, t, STEP_DUR * (id === 'S' ? 1.6 : 3.2), 'triangle', 0.09);
    }

    // Hi-hat: pari tempi normalmente, ogni sedicesimo nella special
    if (s % p.hats === 0) musicHat(t, (s % 8 === 0) ? 0.05 : 0.02);
}

function musicTick() {
    if (!audioCtx) return;
    while (nextNoteTime < audioCtx.currentTime + 0.15) {
        scheduleStep(sectionStep, nextNoteTime);
        sectionStep++;
        nextNoteTime += STEP_DUR;

        // Fine sezione: passa alla successiva nella coda
        if (sectionStep >= PATTERNS[songQueue[queuePos]].len) {
            sectionStep = 0;
            let finished = songQueue[queuePos];
            if (bossActive) {
                // boss vivo: la sezione special gira in loop senza fine
                songQueue = ['S', 'S']; queuePos = 0;
            } else if (finished === 'S') {
                // la special dura una sola passata: rimuovila e riprendi il loop normale
                songQueue.splice(queuePos, 1);
                specialQueued = false;
                queuePos = queuePos % songQueue.length;
            } else {
                queuePos = (queuePos + 1) % songQueue.length;
            }
        }
    }
}

// Inserisce la sezione speciale subito dopo quella corrente (stile "boss theme")
function triggerSpecial() {
    if (specialQueued) return; // mai più di una in coda
    specialQueued = true;
    songQueue.splice(queuePos + 1, 0, 'S');
}

function startMusic() {
    if (musicTimer || !audioCtx) return;
    if (!musicGain) {
        musicGain = audioCtx.createGain();
        musicGain.gain.value = musicOn ? 0.9 : 0;
        musicGain.connect(audioCtx.destination);
    }
    if (!noiseBuffer) {
        noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.06, audioCtx.sampleRate);
        let d = noiseBuffer.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    nextNoteTime = audioCtx.currentTime + 0.1;
    musicTimer = setInterval(musicTick, 50);
}

function toggleMusic() {
    musicOn = !musicOn;
    if (musicGain) musicGain.gain.value = musicOn ? 0.9 : 0;
    if (musicHint) musicHint.setText(musicOn ? 'M: AUDIO ON' : 'M: AUDIO OFF');
}

// ---------- MOTORE BOSS ----------
function spawnBoss(scene) {
    let def = BOSSES[bossIndex];
    boss = {
        def: def, type: def.key, hp: def.hp, maxHp: Math.max(def.hp, 1),
        x: Phaser.Math.Between(100, 300),
        y: player.y - 450,
        t: 0, st: 0, state: 'coin', phase: 0,
        vx: (Math.random() < 0.5 ? -1 : 1) * 60,
        r: 20, cool: 1.5, vulnerable: true,
        hist: [], key: null, keyTaken: false, rise: 0, alphaV: 1,
        g: scene.add.graphics().setDepth(3)
    };
    if (def.key === 'DATALOSS') boss.y = player.y + 420; // sale dal basso
    if (def.key === 'FIREWALL') boss.y = player.y - 260;
    bossActive = true;
    songQueue = ['S', 'S']; queuePos = 0; sectionStep = 0; // musica boss: special in loop
    bossBannerText(scene, 'BOSS: ' + def.key, '#ff0033');
    beep(110, 0.6, 'sawtooth', 0.1, 55);
}

function bossBannerText(scene, txt, color) {
    let banner = scene.add.text(200, 220, txt, {
        fontSize: '24px', fill: color, fontFamily: 'Courier New, monospace', fontStyle: 'bold'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(5).setAlpha(0);
    scene.tweens.add({ targets: banner, alpha: 1, duration: 250, yoyo: true, hold: 1100, onComplete: () => banner.destroy() });
}

function endBoss(scene, defeated) {
    if (defeated) {
        deathEmitter.emitParticleAt(boss.x, boss.y, 30);
        bossBannerText(scene, 'BOSS SCONFITTO!', C_CYAN_CSS);
        beep(523, 0.12, 'square', 0.08);
        setTimeout(() => beep(659, 0.12, 'square', 0.08), 130);
        setTimeout(() => beep(784, 0.25, 'square', 0.09), 260);
        score += 1000;
        updateScoreText();
    }
    boss.g.destroy();
    boss = null;
    bossBullets = [];
    bossIndex++;
    if (defeated) saveBossesDefeated(); // Salva i boss sconfitti in localStorage DOPO l'incremento
    bossActive = false;
    songQueue = ['A', 'A', 'B', 'B']; queuePos = 0; sectionStep = 0;
}

function hitBoss(scene, dmg) {
    boss.hp -= dmg;
    beep(180, 0.12, 'square', 0.08, 90);
    if (boss.hp <= 0) endBoss(scene, true);
}

function damagePlayer(scene) {
    if (shieldCharges > 0) {
        shieldCharges--;
        beep(440, 0.15, 'triangle', 0.07, 220);
        scene.cameras.main.flash(150, 255, 255, 255);
        return;
    }
    triggerGameOver(scene, 'HACKERATO!');
}

function bossOverlap(cx, cy, r) {
    return Math.hypot(player.x - cx, player.y - cy) < r + 11;
}

function bossStomp(cy) {
    return player.body.velocity.y > 0 && player.y < cy - 2;
}

// ---------- UPDATE BOSS (comportamenti) ----------
function updateBoss(scene, delta) {
    if (!boss) return;
    let d = delta / 1000;
    let b = boss, type = b.type;
    b.t += d;
    let followY = player.y - 150;
    if (player.y < b.y - 520 && type !== 'DATALOSS') { endBoss(scene, false); return; }

    if (type === 'GLITCH') {
        b.x += b.vx * d;
        if (b.x < 50 || b.x > 350) b.vx *= -1;
        b.y += (followY - b.y) * 0.4 * d;
        b.r = 18 + Math.sin(b.t * 20) * 3;
    } else if (type === 'FIREWALL') {
        b.y += (player.y - 240 - b.y) * 0.5 * d;
        b.gap = 200 + Math.sin(b.t * 0.8) * 150;
        if (Math.abs(player.y - b.y) < 16 && (player.x < b.gap - 45 || player.x > b.gap + 45)) {
            damagePlayer(scene); return;
        }
        if (player.y < b.y - 320) { endBoss(scene, false); return; }
    } else if (type === 'MALWARE') {
        let spd = (70 + (b.maxHp - b.hp) * 40) * d;
        let dx = player.x - b.x, dy = (player.y - 140) - b.y;
        let dist = Math.hypot(dx, dy) || 1;
        b.x += dx / dist * spd; b.y += dy / dist * spd;
        b.r = 22 * (0.7 + 0.3 * (b.hp / b.maxHp));
    } else if (type === 'TROJAN') {
        b.st += d;
        if (b.state === 'coin') {
            b.y += (followY - b.y) * 0.6 * d;
            if (bossOverlap(b.x, b.y, 130)) { b.state = 'dash'; b.st = 0; beep(600, 0.1, 'square', 0.07, 200); }
        } else if (b.state === 'dash') {
            let dx = player.x - b.x, dy = player.y - b.y, dist = Math.hypot(dx, dy) || 1;
            b.x += dx / dist * 280 * d; b.y += dy / dist * 280 * d;
            if (b.st > 0.5) { b.state = 'rest'; b.st = 0; }
        } else if (b.st > 1.2) {
            b.state = 'coin'; b.st = 0;
            b.x = Phaser.Math.Between(80, 320);
            b.y = player.y - 260;
        }
    } else if (type === 'WORM') {
        b.x = 200 + Math.sin(b.t * 1.2) * 150;
        b.y += ((player.y - 200) - b.y) * 0.8 * d;
        b.hist.unshift({ x: b.x, y: b.y });
        if (b.hist.length > 80) b.hist.pop();
        if (bossOverlap(b.x, b.y, 14)) {
            if (bossStomp(b.y)) { endBoss(scene, true); return; }
            damagePlayer(scene); return;
        }
        for (let i = 1; i < 6; i++) {
            let seg = b.hist[Math.min(b.hist.length - 1, i * 9)];
            if (seg && bossOverlap(seg.x, seg.y, 11)) { damagePlayer(scene); return; }
        }
    } else if (type === 'DDOS') {
        b.x = 200 + Math.sin(b.t * 0.6) * 60;
        b.y += (followY - b.y) * 0.5 * d;
        b.cool -= d;
        if (b.cool <= 0) {
            for (let i = -2; i <= 2; i++) bossBullets.push({ x: b.x, y: b.y + 15, vx: i * 45, vy: 190 });
            b.cool = 4.2; b.state = 'hot'; b.st = 0;
        }
        if (b.state === 'hot') { b.st += d; if (b.st > 2.5) b.state = 'fire'; }
        if (bossOverlap(b.x, b.y, b.r)) {
            if (bossStomp(b.y)) {
                if (b.state === 'hot') { hitBoss(scene, 1); if (!boss) return; }
                player.setVelocityY(-650);
                return;
            }
            damagePlayer(scene); return;
        }
    }
    if (type === 'RANSOMWARE') {
        b.x += (200 - b.x) * 0.5 * d;
        b.y += (player.y - 170 - b.y) * 0.8 * d;
        let blink = Math.floor(b.t / 1.2) % 2 === 0;
        platforms.children.iterate(p => {
            if (p && Math.abs(p.y - b.y) < 260) p.alpha = blink ? 0.12 : 1;
        });
        if (!b.keyTaken) {
            if (!b.key) b.key = { x: b.x, y: b.y - 180 };
            b.key.y = b.y - 180 + Math.sin(b.t * 3) * 8;
            if (bossOverlap(b.key.x, b.key.y, 16)) {
                b.keyTaken = true; b.key = null;
                bossBannerText(scene, 'SCUDO RIMOSSO!', '#fff700');
                beep(880, 0.15, 'triangle', 0.08, 1300);
            }
        }
        if (bossOverlap(b.x, b.y, 26)) {
            if (bossStomp(b.y)) {
                if (b.keyTaken) { endBoss(scene, true); return; }
                player.setVelocityY(-650);
                return;
            }
            damagePlayer(scene); return;
        }
    } else if (type === 'DATALOSS') {
        b.rise += 60 * d;
        b.y -= 60 * d;
        b.x += (player.x - b.x) * 0.2 * d;
        platforms.children.iterate(p => {
            if (p && Math.abs(p.y - b.y) < 70 && Math.abs(p.x - b.x) < 90) p.destroy();
        });
        if (bossOverlap(b.x, b.y, 34)) { damagePlayer(scene); return; }
        if (player.y < b.y - 300 || b.rise > 2400) { endBoss(scene, false); return; }
    } else if (type === 'ROOTKIT') {
        b.st += d;
        if (b.state === 'vis') {
            if (b.st > 2.5) { b.state = 'invis'; b.st = 0; }
        } else if (b.st > 2.2) {
            b.state = 'vis'; b.st = 0;
            b.x = Phaser.Math.Between(70, 330);
            b.y = player.y - Phaser.Math.Between(140, 260);
            beep(900, 0.08, 'square', 0.05, 300);
        }
        b.alphaV = b.state === 'vis'
            ? Math.min(1, b.alphaV + d * 4)
            : Math.max(0, b.alphaV - d * 4);
        if (b.state === 'vis' && bossOverlap(b.x, b.y, b.r)) {
            if (bossStomp(b.y)) {
                hitBoss(scene, 1);
                if (!boss) return;
                player.setVelocityY(-650);
                return;
            }
            damagePlayer(scene); return;
        }
    } else if (type === 'AI') {
        b.y += (followY - b.y) * 0.6 * d;
        b.phase = b.hp >= 4 ? 1 : (b.hp >= 2 ? 2 : 3);
        if (b.phase === 1) {
            b.x = 200 + Math.sin(b.t * 0.7) * 80;
            b.cool -= d;
            if (b.cool <= 0) {
                for (let i = -2; i <= 2; i++) bossBullets.push({ x: b.x, y: b.y + 18, vx: i * 55, vy: 200 });
                b.cool = 2.2;
            }
            b.vulnerable = true;
        } else if (b.phase === 2) {
            b.x = 200 + Math.sin(b.t * 0.9) * 100;
            b.state = Math.floor(b.t / 2.4) % 2 === 0 ? 'vis' : 'invis';
            b.vulnerable = b.state === 'vis';
        } else {
            b.st += d;
            if (b.state !== 'dash' && b.st > 0.8) {
                b.state = 'dash'; b.st = 0;
                b.dashX = player.x; b.dashY = player.y - 60;
            }
            if (b.state === 'dash') {
                let dx = b.dashX - b.x, dy = b.dashY - b.y, dd = Math.hypot(dx, dy) || 1;
                b.x += dx / dd * 420 * d; b.y += dy / dd * 420 * d;
                if (dd < 14) { b.state = 'rest'; b.st = 0; }
            }
            b.vulnerable = true;
        }
        if (bossOverlap(b.x, b.y, b.r + 6)) {
            if (bossStomp(b.y)) {
                if (b.vulnerable) {
                    hitBoss(scene, 1);
                    if (!boss) return;
                }
                player.setVelocityY(-650);
                return;
            }
            damagePlayer(scene); return;
        }
    }

    if (type === 'GLITCH' || type === 'MALWARE') {
        if (bossOverlap(b.x, b.y, b.r)) {
            if (bossStomp(b.y)) {
                hitBoss(scene, 1);
                if (!boss) return;
                player.setVelocityY(-650);
                return;
            }
            damagePlayer(scene); return;
        }
    } else if (type === 'TROJAN') {
        if (b.state !== 'coin' && bossOverlap(b.x, b.y, 20)) {
            if (b.state === 'rest' && bossStomp(b.y)) { endBoss(scene, true); return; }
            damagePlayer(scene); return;
        }
    }
}

// ---------- RENDER BOSS ----------
function drawBoss(b, g) {
    g.clear();
    let t = b.t;
    if (b.type === 'GLITCH') {
        let s = 15 + Math.sin(t * 20) * 3;
        g.fillStyle(Math.floor(t * 10) % 2 ? 0xff0033 : 0x99001f, 0.9);
        g.fillRect(b.x - s, b.y - s * (0.8 + Math.sin(t * 13) * 0.2), s * 2, s * 2);
    } else if (b.type === 'FIREWALL') {
        let gx = b.gap || 200;
        g.fillStyle(0xff9d00, 0.9);
        g.fillRect(0, b.y - 10, gx - 45, 20);
        g.fillRect(gx + 45, b.y - 10, 400 - (gx + 45), 20);
        g.fillStyle(0xffffff, 0.8);
        g.fillRect(gx - 49, b.y - 12, 4, 24);
        g.fillRect(gx + 45, b.y - 12, 4, 24);
    } else if (b.type === 'MALWARE') {
        g.fillStyle(0x660099, 0.95);
        g.fillCircle(b.x, b.y, b.r);
        g.lineStyle(3, 0xff00ff, 0.9);
        for (let i = 0; i < 8; i++) {
            let a = t * 2 + i * Math.PI / 4;
            g.lineBetween(b.x + Math.cos(a) * b.r, b.y + Math.sin(a) * b.r,
                b.x + Math.cos(a) * (b.r + 8), b.y + Math.sin(a) * (b.r + 8));
        }
    } else if (b.type === 'TROJAN') {
        if (b.state === 'coin') {
            g.fillStyle(0xffd700, 1);
            g.fillCircle(b.x, b.y, 20 + Math.sin(t * 6) * 2);
            g.lineStyle(3, 0xffffff, 0.8);
            g.strokeCircle(b.x, b.y, 20);
        } else {
            g.fillStyle(0xff0033, 1);
            g.fillTriangle(b.x, b.y - 22, b.x - 20, b.y + 16, b.x + 20, b.y + 16);
        }
    } else if (b.type === 'WORM') {
        for (let i = 5; i >= 0; i--) {
            let seg = b.hist[Math.min(b.hist.length - 1, i * 9)];
            if (!seg) continue;
            g.fillStyle(0x00ff66, i === 0 ? 1 : Math.max(0.25, 0.7 - i * 0.08));
            g.fillCircle(seg.x, seg.y, i === 0 ? 13 : 11 - i);
        }
    } else if (b.type === 'DDOS') {
        let hot = b.state === 'hot';
        g.fillStyle(hot ? 0x888888 : 0x0066ff, 0.95);
        g.fillCircle(b.x, b.y, 20);
        g.lineStyle(2, hot ? 0xcccccc : 0x00ccff, 0.8);
        g.strokeCircle(b.x, b.y, 26 + Math.sin(t * 6) * 3);
    } else if (b.type === 'RANSOMWARE') {
        g.fillStyle(0xff0033, 0.9);
        g.fillRect(b.x - 20, b.y - 10, 40, 32);
        g.lineStyle(5, 0xffd700, 1);
        g.beginPath(); g.arc(b.x, b.y - 10, 14, Math.PI, 0); g.strokePath();
        g.fillStyle(0x000000, 1);
        g.fillCircle(b.x - 8, b.y + 2, 3.5);
        g.fillCircle(b.x + 8, b.y + 2, 3.5);
        if (!b.keyTaken && b.key) {
            g.fillStyle(0xffd700, 1);
            g.fillCircle(b.key.x, b.key.y, 10);
            g.lineStyle(2, 0xffffff, 0.9);
            g.strokeCircle(b.key.x, b.key.y, 14);
        }
    } else if (b.type === 'DATALOSS') {
        g.fillStyle(0x000000, 1);
        g.fillCircle(b.x, b.y, 32);
        g.lineStyle(3, 0x00f0ff, 0.7 + Math.sin(t * 8) * 0.2);
        g.strokeCircle(b.x, b.y, 38 + Math.sin(t * 5) * 5);
    } else if (b.type === 'ROOTKIT') {
        g.fillStyle(0xcccccc, b.alphaV);
        g.fillRect(b.x - 14, b.y - 14, 28, 28);
        g.lineStyle(2, 0xffffff, b.alphaV * 0.8);
        g.strokeRect(b.x - 14, b.y - 14, 28, 28);
    } else if (b.type === 'AI') {
        let c = Phaser.Display.Color.HSVToRGB((t * 0.4) % 1, 0.9, 1).color;
        let pts = [
            { x: b.x, y: b.y - 26 }, { x: b.x + 24, y: b.y - 8 }, { x: b.x + 16, y: b.y + 22 },
            { x: b.x - 16, y: b.y + 22 }, { x: b.x - 24, y: b.y - 8 }
        ];
        g.fillStyle(c, 0.9);
        g.fillPoints(pts, true);
        g.lineStyle(2, 0xffffff, 0.7);
        g.strokePoints(pts, true, true);
    }
    if (b.maxHp > 1) {
        for (let i = 0; i < b.maxHp; i++) {
            g.fillStyle(i < b.hp ? 0xff0033 : 0x444444, 1);
            g.fillCircle(b.x - (b.maxHp - 1) * 7 + i * 14, b.y - 42, 4);
        }
    }
}

function updateBossBullets(scene, delta) {
    let d = delta / 1000;
    for (let i = bossBullets.length - 1; i >= 0; i--) {
        let bl = bossBullets[i];
        bl.x += bl.vx * d;
        bl.y += bl.vy * d;
        if (Math.hypot(player.x - bl.x, player.y - bl.y) < 12) {
            bossBullets.splice(i, 1);
            damagePlayer(scene);
            continue;
        }
        if (bl.y > scene.cameras.main.scrollY + 700) bossBullets.splice(i, 1);
    }
    bulletG.clear();
    bossBullets.forEach(bl => {
        bulletG.fillStyle(0x00ccff, 0.9);
        bulletG.fillCircle(bl.x, bl.y, 5);
    });
}

// ---------- SHOP (schermata game over) ----------
let shopRows = null;
let shopCreditsText = null;

function showShop(scene) {
    shopRows = [];
    let y0 = 306;
    UPGRADES.forEach((u, i) => {
        let y = y0 + i * 44;
        let nameT = scene.add.text(30, y, '', {
            fontSize: '13px', fill: '#ffffff', fontFamily: 'Courier New, monospace', fontStyle: 'bold'
        }).setScrollFactor(0);
        let descT = scene.add.text(30, y + 16, '', {
            fontSize: '9px', fill: '#8899aa', fontFamily: 'Courier New, monospace'
        }).setScrollFactor(0);
        // Hit area ESPLICITA: Phaser la calcola dalla dimensione del testo
        // al momento del setInteractive (qui il testo e' ancora vuoto -> 0x0)
        nameT.setInteractive(new Phaser.Geom.Rectangle(0, 0, 340, 34), Phaser.Geom.Rectangle.Contains);
        nameT.on('pointerdown', () => tryBuy(scene, u));
        shopRows.push({ u, nameT, descT });
    });
    shopCreditsText = scene.add.text(200, 268, '', {
        fontSize: '14px', fill: C_YELLOW_CSS, fontFamily: 'Courier New, monospace', fontStyle: 'bold'
    }).setOrigin(0.5).setScrollFactor(0);
    scene.add.text(200, 250, '--- UPGRADE BAY ---', {
        fontSize: '14px', fill: '#a855f7', fontFamily: 'Courier New, monospace', fontStyle: 'bold'
    }).setOrigin(0.5).setScrollFactor(0);
    scene.add.text(200, 288, '1 MONETA RACCOLTA = 1 CREDITO', {
        fontSize: '9px', fill: '#aaaaaa', fontFamily: 'Courier New, monospace'
    }).setOrigin(0.5).setScrollFactor(0);
    refreshShop();

    scene.add.text(200, 560, '- TOCCA PER RIGIOCARE -', {
        fontSize: '14px', fill: '#aaaaaa', fontFamily: 'Courier New, monospace'
    }).setOrigin(0.5).setScrollFactor(0).setInteractive({ useHandCursor: true })
        .on('pointerdown', () => scene.scene.restart());
}

function refreshShop() {
    if (!shopRows) return;
    shopRows.forEach(r => {
        let lvl = upLevels[r.u.key];
        let maxed = lvl >= r.u.max;
        let cost = maxed ? 0 : r.u.costs[lvl];
        let affordable = !maxed && credits >= cost;
        r.nameT.setText(
            r.u.name + '  Lv.' + lvl + '/' + r.u.max +
            (maxed ? '  [MAX]' : '  [' + cost + ' CR]')
        );
        r.nameT.setColor(maxed ? '#666677' : (affordable ? '#00f0ff' : '#555566'));
        r.descT.setText(r.u.desc);
    });
    if (shopCreditsText) shopCreditsText.setText('CREDITI: ' + credits);
}

function tryBuy(scene, u) {
    let lvl = upLevels[u.key];
    if (lvl >= u.max) return;
    let cost = u.costs[lvl];
    if (credits < cost) {
        beep(140, 0.15, 'square', 0.05); // negato
        return;
    }
    credits -= cost;
    upLevels[u.key] = lvl + 1;
    saveUpgrades();
    refreshShop();
    beep(650, 0.1, 'triangle', 0.06, 1100); // acquisto
}

function showMilestone(scene, zone) {
    curZoneIdx = zone % ZONES.length;
    drawBgGradient(scene);
    triggerSpecial(); // sezione musicale "boss" stile Megaman

    scene.cameras.main.flash(250,
        (curZoneIdx === 1) ? 168 : 0,
        (curZoneIdx === 2) ? 80 : 60,
        (curZoneIdx === 3) ? 0 : (curZoneIdx === 4 ? 60 : 120));

    let banner = scene.add.text(200, 260, 'ZONA ' + zone, {
        fontSize: '26px', fill: C_CYAN_CSS, fontFamily: 'Courier New, monospace', fontStyle: 'bold'
    }).setOrigin(0.5).setScrollFactor(0).setAlpha(0);

    if (canUseGlow(scene)) banner.setPostPipeline('GlowFX');

    scene.tweens.add({
        targets: banner,
        alpha: 1, y: 240, duration: 300, yoyo: true, hold: 900,
        ease: 'Sine.easeInOut',
        onComplete: () => banner.destroy()
    });

}

function preload() {
    let g = this.add.graphics();

    // 1. Texture Giocatore
    g.lineStyle(2, 0xffffff, 1);
    g.fillStyle(C_CYAN, 0.8);
    g.fillCircle(16, 16, 14);
    g.strokeCircle(16, 16, 14);
    g.generateTexture('player', 32, 32);
    g.clear();

    // 2. Texture Piattaforma (una per tipo) - 24px altezza
    function makePlatformTex(key, color) {
        g.lineStyle(3, 0xffffff, 1);
        g.fillStyle(color, 0.35);
        g.fillRoundedRect(0, 0, 80, 24, 4);
        g.strokeRoundedRect(0, 0, 80, 24, 4);
        g.generateTexture(key, 80, 24);
        g.clear();
    }
    makePlatformTex('platform', C_PURPLE);      // normale
    makePlatformTex('plat_fragile', 0xff9d00);  // fragile: scoppia
    makePlatformTex('plat_spring', 0x00ff9d);   // molla: salto potenziato
    makePlatformTex('plat_moving', 0x00b3ff);   // mobile: oscilla
    makePlatformTex('plat_wobbly', 0xfff700);   // traballante: inclina

    // 3. Texture Moneta
    g.lineStyle(2, 0xffffff, 1);
    g.fillStyle(C_YELLOW, 1);
    g.fillCircle(8, 8, 5);
    g.strokeCircle(8, 8, 7);
    g.generateTexture('coin', 16, 16);
    g.clear();

    // 4. Texture Nemico
    g.lineStyle(2, 0xffffff, 1);
    g.fillStyle(C_RED, 0.9);
    g.beginPath(); g.moveTo(12, 0); g.lineTo(24, 24); g.lineTo(0, 24); g.closePath();
    g.fill(); g.stroke();
    g.generateTexture('enemy', 24, 24);
    g.clear();
    
    // 5. Texture Particella Scia
    g.fillStyle(0xffffff, 1);
    g.fillRect(0,0,4,4);
    g.generateTexture('particle', 4, 4);
    g.clear();

    // 6. Texture Checkpoint (bandiera/beacon)
    g.lineStyle(2, 0xffffff, 1);
    g.fillStyle(0x00ff9d, 0.9);
    // stelo
    g.fillRect(14, 4, 3, 24);
    // bandiera
    g.fillTriangle(17, 4, 30, 10, 17, 16);
    g.strokeRect(14, 4, 3, 24);
    g.strokeTriangle(17, 4, 30, 10, 17, 16);
    g.generateTexture('checkpoint', 32, 32);
    g.clear();

    g.destroy();
}

function create() {
    score = 0;
    bestY = 0;
    gameOver = false;
    touchX = null; // Resetta input touch
    lastZone = 0;
    curZoneIdx = 0;
    isHolding = false;
    runCoins = 0;
    loadPersisted();
    loadUpgrades();
    bossIndex = loadBossesDefeated(); // Carica i boss sconfitti precedenti
    loadCheckpoints();
    shieldCharges = upLevels.shield;
    boss = null;
    bossBullets = [];
    bossActive = false;

    // Reset checkpoints
    checkpointPlatforms = this.physics.add.group();
    respawnCheckpointY = null;

    // Sfondo Gradiente (segue la camera in scorrimento verticale)
    bgGradient = this.add.graphics().setScrollFactor(0);
    drawBgGradient(this);

    // Gruppi di Fisica
    platforms = this.physics.add.staticGroup();
    coins = this.physics.add.group();
    enemies = this.physics.add.group();

    // Verifichiamo la sicurezza del pipeline prima di applicarlo
    if (canUseGlow(this)) {
        platforms.setPostPipeline('GlowFX');
        coins.setPostPipeline('GlowFX');
        enemies.setPostPipeline('GlowFX');
    }

    // Base iniziale (coordinate mondo fisse: si sale verso Y negativi)
    platforms.create(200, 570, 'platform').setScale(5, 1).refreshBody();

    // Generazione piattaforme iniziali
    for (let i = 1; i < 7; i++) {
        spawnPlatform(this, 570 - (i * SPAWN_GAP));
    }
    nextSpawnY = 570 - (7 * SPAWN_GAP);

    // Giocatore
    // START BOOST: si parte piu' in alto in base al livello acquistato
    let startY = 450 - 150 * upLevels.boost;
    player = this.physics.add.sprite(200, startY, 'player');
    player.setBounce(0.1);
    player.setCircle(14, 2, 2);
    player.body.setMaxVelocityY(800); // Limita velocità caduta per evitare tunneling (salto -850 passa)
    bestY = player.y;

    // Camera vera: segue il giocatore in entrambe le direzioni.
    // Il livello resta fisso: se cadi, vedi di nuovo tutto ciò che avevi superato.
    // Bounds: infinito verso l'alto, base del mondo a y=600
    this.cameras.main.setBounds(0, -1000000, 400, 1000600);
    this.cameras.main.startFollow(player, true, 0.1, 0.1);
    this.cameras.main.centerOn(200, player.y);

    // Anello visivo dello scudo (segue il player)
    shieldRing = this.add.graphics().setDepth(2);

    // Effetto Particelle Scia (Più efficiente per mobile)
    trailEmitter = this.add.particles(0, 0, 'particle', {
        speed: { min: 10, max: 50 },
        scale: { start: 1, end: 0 },
        alpha: { start: 0.5, end: 0 },
        lifespan: 500,
        blendMode: 'ADD',
        tint: C_CYAN,
        emitting: false
    });
    trailEmitter.startFollow(player);

    // Effetto Particelle Morte
    deathEmitter = this.add.particles(0, 0, 'particle', {
        speed: { min: 100, max: 300 },
        scale: { start: 2, end: 0 },
        lifespan: 800,
        blendMode: 'ADD',
        tint: C_RED,
        emitting: false
    });

    // Applica Glow al giocatore in sicurezza
    if (canUseGlow(this)) {
        player.setPostPipeline('GlowFX');
    }

    // Collisioni
    this.physics.add.collider(player, platforms, jumpOnPlatform, null, this);
    this.physics.add.overlap(player, coins, collectCoin, null, this);
    this.physics.add.overlap(player, enemies, hitEnemy, null, this);

    // Checkpoint: overlap detection
    this.physics.add.overlap(player, checkpointPlatforms, activateCheckpoint, null, this);

    // Controlli Tastiera
    cursors = this.input.keyboard.createCursorKeys();
    spaceBar = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    // Impedisce il comportamento predefinito dei tasti di gioco (scroll pagina con SPAZIO/frecce)
    this.input.keyboard.addCapture('UP,DOWN,LEFT,RIGHT,SPACE,S');
    this.input.keyboard.on('keydown-S', () => toggleStats(this));
    this.input.keyboard.on('keydown', initAudio);

    // Tracciamento pressione tasti per salto caricato (PC)
    this.input.keyboard.on('keydown-UP', () => { if (keyDownTime === 0) keyDownTime = this.time.now; });
    this.input.keyboard.on('keydown-SPACE', () => { if (keyDownTime === 0) keyDownTime = this.time.now; });
    this.input.keyboard.on('keyup-UP', () => { keyDownTime = 0; });
    this.input.keyboard.on('keyup-SPACE', () => { keyDownTime = 0; });

    // Controlli Touch JOYSTICK: il dito trascinato determina la direzione
    // Il salto caricato si attiva tenendo premuto il dito per >150ms
    this.input.on('pointerdown', (pointer) => {
        initAudio();
        lastTapT = this.time.now;
        keyDownTime = this.time.now; // anche touch conta
        joyStartX = pointer.x;
        joyDir = 0;
        touchX = pointer.x;
        isHolding = true;
        jumpPressedEdge = true;
    });
    this.input.on('pointermove', (pointer) => {
        if (pointer.isDown && joyStartX !== null) {
            let dx = pointer.x - joyStartX;
            let deadzone = 18;
            if (dx > deadzone) joyDir = 1;
            else if (dx < -deadzone) joyDir = -1;
            else joyDir = 0;
            touchX = pointer.x;
        }
    });
    this.input.on('pointerup', () => { touchX = null; joyStartX = null; joyDir = 0; isHolding = false; keyDownTime = 0; });

    // Anello di carica touch (feedback del salto caricato)
    bulletG = this.add.graphics().setDepth(3);

    // Ghost della best height storica
    ghostLine = this.add.graphics().setDepth(1);
    drawGhostLine(this);

    // UI semplificata: solo score e crediti
    scoreText = this.add.text(10, 10, 'SCORE 0', {
        fontSize: '14px', fill: '#ffffff', fontFamily: 'Courier New, monospace', fontStyle: 'bold',
        stroke: '#000000', strokeThickness: 2
    }).setScrollFactor(0);
    if (canUseGlow(this)) {
        scoreText.setPostPipeline('GlowFX');
    }

    creditsHud = this.add.text(390, 10, 'CR ' + (credits + runCoins), {
        fontSize: '14px', fill: C_YELLOW_CSS, fontFamily: 'Courier New, monospace', fontStyle: 'bold',
        stroke: '#000000', strokeThickness: 2
    }).setOrigin(1, 0).setScrollFactor(0);

    // Bottone STATS (mobile)
    let statsBtn = this.add.text(390, 30, '[STATS]', {
        fontSize: '10px', fill: '#00f0ff', fontFamily: 'Courier New, monospace', fontStyle: 'bold',
        backgroundColor: '#020617', padding: { x: 3, y: 1 }
    }).setOrigin(1, 0).setScrollFactor(0).setInteractive({ useHandCursor: true });
    statsBtn.on('pointerdown', () => toggleStats(this));

    this.input.keyboard.on('keydown-M', toggleMusic);

    // Tutorial solo alla prima apertura
    let tutSeen = false;
    try { tutSeen = !!localStorage.getItem('neonjump_tutseen'); } catch (e) { }
    if (!tutSeen) startTutorial(this);
}

function dismissTutorial(scene) {

    tutObjs.forEach(o => o.destroy());
    tutObjs = [];
    scene.physics.resume();
    try { localStorage.setItem('neonjump_tutseen', '1'); } catch (e) { }
}

function update(time, delta) {
    if (gameOver || tutorialActive) return;

    // Movimento: accelerazione progressiva, potenziata dall'upgrade CONTROL
    let isMoving = false;
    let cLvl = upLevels.control;
    let maxVx = 250 * (1 + 0.12 * cLvl);
    let accel = 3000 * (1 + 0.3 * cLvl);
    let targetVx = 0;
    if (cursors.left.isDown || joyDir === -1) {
        targetVx = -maxVx;
        isMoving = true;
    } else if (cursors.right.isDown || joyDir === 1) {
        targetVx = maxVx;
        isMoving = true;
    }
    let accelStep = accel * (delta / 1000);
    // Se il player è su un traballante inclinato, la pendenza lo spinge
    // e NON viene decelerato verso 0 (altrimenti resta fermo sulla pendenza)
    let onSlope = false;
    let slopePush = 0;
    if (player.body.touching.down) {
        platforms.children.iterate(child => {
            if (child && child.getData('type') === 'wobbly' && Math.abs(child.angle) > 1 &&
                Math.abs(player.x - child.x) < 46 &&
                Math.abs(player.y - (child.y - 12)) < 22) {
                onSlope = true;
                slopePush = child.angle * 8; // forza di scivolamento proporzionale all'inclinazione
            }
        });
    }
    if (onSlope) {
        // Sulla pendenza: nessuna deceleranza, la forza di scivolamento si accumula
        // (contrabile muovendosi verso l'alto, ma stando fermi si scivola)
        player.body.velocity.x += slopePush * (delta / 1000) * 60;
        // Limita la velocità di scivolamento per non essere frustrante
        player.body.velocity.x = Phaser.Math.Clamp(player.body.velocity.x, -200, 200);
    } else {
        player.body.velocity.x += Phaser.Math.Clamp(targetVx - player.body.velocity.x, -accelStep, accelStep);
    }

    // Gestione emissione scia
    if (isMoving || Math.abs(player.body.velocity.y) > 100) {
        trailEmitter.emitting = true;
    } else {
        trailEmitter.emitting = false;
    }

    // Stretch in volo (si allunga con la velocità), se non sta già facendo lo squash
    if (!player.squashing) {
        let s = Phaser.Math.Clamp(1 + Math.abs(player.body.velocity.y) / 3500, 1, 1.12);
        player.setScale(1 - (s - 1) * 0.6, s);
    }

    // Wrap orizzontale stile pacman: appena il centro supera il bordo riappari
    // dall'altro lato SEMI-VISIBILE (x=0/400), così resti dentro il mondo.
    // Prima riapparivi a x=-16/416, completamente fuori: nessuna piattaforma
    // laggiù e si finiva in caduta libera fino al "CADUTO NELL'ABISSO".
    if (player.x > 400) player.x = 0;
    else if (player.x < 0) player.x = 400;

    // --- Mondo fisso + camera: niente più scorrimento "artificiale" ---
    let camTop = this.cameras.main.scrollY;   // bordo superiore visibile

    // Spawn procedurale: genera piattaforme sopra la camera mentre si sale.
    // Le piattaforme esistenti NON vengono mai mosse o distrutte: il livello persiste.
    while (nextSpawnY > camTop - 150) {
        spawnPlatform(this, nextSpawnY);
        nextSpawnY -= SPAWN_GAP;
    }

    // Culling: rimuove solo ciò che è rimasto molto indietro SOTTO la camera
    let cullLine = camTop + 600 + CULL_MARGIN;
    platforms.children.iterate(child => {
        if (child && child.y > cullLine) child.destroy();
    });
    coins.children.iterate(child => {
        if (child && child.y > cullLine) child.destroy();
    });
    enemies.children.iterate(child => {
        if (child && child.y > cullLine) child.destroy();
    });

    // Culling checkpoint lontani
    checkpointPlatforms.children.iterate(cp => {
        if (cp && cp.y > cullLine) cp.destroy();
    });

    // Rimbalzo nemici sui bordi (niente world bounds, mondo infinito in verticale).
    // Si inverte la velocità SOLO se il nemico sta andando verso il muro,
    // altrimenti la condizione resta vera per più frame e il nemico resta bloccato.
    enemies.children.iterate(child => {
        if (child) {
            if (child.x < 25 && child.body.velocity.x < 0) {
                child.body.velocity.x *= -1;
            } else if (child.x > 375 && child.body.velocity.x > 0) {
                child.body.velocity.x *= -1;
            }
        }
    });

    // Piattaforme MOBILI: oscillazione orizzontale (static body aggiornato a mano)
    platforms.children.iterate(child => {
        if (!child || child.getData('type') !== 'moving') return;
        let t = child.getData('t') + delta / 1000;
        child.setData('t', t);
        let oldX = child.x;
        child.x = child.getData('baseX') + Math.sin(t * 1.5) * 60;
        child.body.updateFromGameObject();
        child.setData('dx', child.x - oldX);
    });

    // Il player in piedi su una mobile viene trasportato dal suo movimento
    if (player.body.touching.down) {
        platforms.children.iterate(child => {
            if (child && child.getData('type') === 'moving' &&
                Math.abs(player.x - child.x) < 46 &&
                Math.abs(player.y - (child.y - 12)) < 22) {
                player.x += child.getData('dx') || 0;
            }
        });
    }

    // Sui TRABALLANTI il salto e' manuale: se sei in piedi e premi/tocchi, salti
    // (non c'e' auto-rimbalzo, quindi senza questo non potresti piu' partire)
    if (player.body.touching.down && (jumpPressedEdge ||
        Phaser.Input.Keyboard.JustDown(spaceBar) ||
        Phaser.Input.Keyboard.JustDown(cursors.up))) {
        let onWobbly = false;
        platforms.children.iterate(child => {
            if (child && child.getData('type') === 'wobbly' &&
                Math.abs(player.x - child.x) < 46 &&
                Math.abs(player.y - (child.y - 12)) < 22) onWobbly = true;
        });
        if (onWobbly) {
            let bm = 1 + 0.06 * upLevels.bounce;
            let holdTime = keyDownTime > 0 ? (this.time.now - keyDownTime) : 0;
            let charged = holdTime > 150;
            player.setVelocityY((charged ? -800 : -550) * bm);
            sfxJump(charged);
            player.squashing = true;
            player.setScale(1.25, 0.75);
            this.tweens.add({
                targets: player, scaleX: 1, scaleY: 1,
                duration: 140, ease: 'Back.easeOut',
                onComplete: () => { player.squashing = false; }
            });
        }
    }
    jumpPressedEdge = false;

    // MAGNET: le monete vicine vengono attirate verso il player
    let magR = [0, 70, 110, 150][upLevels.magnet];
    if (magR > 0) {
        coins.children.iterate(c => {
            if (c && Phaser.Math.Distance.Between(c.x, c.y, player.x, player.y) < magR) {
                this.physics.moveToObject(c, player, 220);
            }
        });
    }

    // Anello visivo dello scudo + anello di carica touch
    if (shieldCharges > 0) {
        shieldRing.clear();
        shieldRing.lineStyle(2, 0xffffff, 0.5);
        shieldRing.strokeCircle(player.x, player.y, 21);
    } else {
        shieldRing.clear();
    }

    // BOSS: spawn per soglia di ALTEZZA pura (px saliti), le monete non contano
    if (bossIndex < BOSSES.length && !boss && (570 - bestY) >= BOSSES[bossIndex].height) {
        spawnBoss(this);
    }
    if (boss) {
        updateBoss(this, delta);
        if (boss) drawBoss(boss, boss.g);
    }
    updateBossBullets(this, delta);

    // Safety: se cadi oltre la zona di culling → respawn a checkpoint o game over
    if (player.y > cullLine) {
        if (respawnCheckpointY !== null && respawnCheckpointY < player.y) {
            // Respawn all'ultimo checkpoint
            respawnAtCheckpoint(this);
        } else {
            triggerGameOver(this, 'CADUTO NELL\'ABISSO');
        }
    }

    // Punteggio basato sull'altezza massima raggiunta (persistente: se cadi non lo perdi)
    if (player.y < bestY) {
        bestY = player.y;
        let newScore = Math.floor((570 - bestY) / 2);
        if (newScore > score) {
            score = newScore;
            updateScoreText();
        }
    }

    // Milestone di zona ogni ZONE_SIZE px saliti
    let zone = Math.floor(Math.max(0, 570 - player.y) / ZONE_SIZE);
    if (zone > lastZone) {
        lastZone = zone;
        showMilestone(this, zone);
    }

    // Best height storica: aggiorna ghost line in diretta e persiste al game over
    let climbed = 570 - player.y;
    if (climbed > bestHeight) {
        bestHeight = climbed;
        drawGhostLine(this);
    }
}

function drawBgGradient(scene) {
    let zone = ZONES[curZoneIdx] || ZONES[0];
    bgGradient.clear();
    bgGradient.fillGradientStyle(zone.top, zone.top, zone.bottom, zone.bottom, 1);
    bgGradient.fillRect(0, 0, 400, 600);
}

function updateScoreText() {
    let s = "000000" + score;
    scoreText.setText('SCORE: ' + s.slice(-6));
}

function jumpOnPlatform(player, platform) {
    if (!player.body.touching.down) return;
    let type = platform.getData('type') || 'normal';

    // TRABALLANTE: non rimbalza, inclina e fa scivolare (puro Getting Over It)
    if (type === 'wobbly') {
        // Il callback di collisione scatta OGNI FRAME mentre si tocca la pedana:
        // senza debounce il tilt alternerebbe direzione 60 volte al secondo (vibrazione)
        let now = this.time.now;
        if (now - (platform.getData('lastTilt') || 0) < 500) return;
        platform.setData('lastTilt', now);
        let tilt = platform.getData('tilt') + 1;
        platform.setData('tilt', tilt);
        let dir = (tilt % 2 === 0) ? 1 : -1;
        this.tweens.add({ targets: platform, angle: dir * 12, duration: 220, ease: 'Sine.easeOut' });
        player.body.velocity.x += dir * 70; // spinta di scivolamento
        beep(220, 0.1, 'sine', 0.05, 130);
        return;
    }

    // FRAGILE: conta i salti; al secondo scoppia (dopo che il rimbalzo e' partito)
    if (type === 'fragile') {
        let now = this.time.now;
        if (now - (platform.getData('lastHit') || 0) < 300) return; // debounce contatti
        platform.setData('lastHit', now);
        let hits = platform.getData('hits') + 1;
        platform.setData('hits', hits);
        if (hits >= 2) {
            this.time.delayedCall(120, () => {
                if (!platform.active) return;
                beep(150, 0.25, 'sawtooth', 0.07, 60);
                this.tweens.add({
                    targets: platform, alpha: 0, angle: 25, duration: 200,
                    onComplete: () => platform.destroy()
                });
            });
        } else {
            // primo colpo: trema come avvertimento
            this.tweens.add({ targets: platform, x: platform.x + 2, duration: 40, yoyo: true, repeat: 2 });
            beep(320, 0.08, 'square', 0.04);
        }
    }

    // Salto caricato: tenendo premuto per >150ms (touch o tasto)
    let holdTime = keyDownTime > 0 ? (this.time.now - keyDownTime) : 0;
    let charged = holdTime > 150;
    let power;
    if (type === 'spring') {
        power = -1100; // super salto: almeno 3 piattaforme
        beep(600, 0.25, 'triangle', 0.1, 1200);
        // Effetto particellare sulla molla
        this.tweens.add({ targets: platform, scaleX: 1.3, scaleY: 0.6, duration: 100, yoyo: true });
    } else {
        let bm = 1 + 0.06 * upLevels.bounce;
        power = (charged ? -800 : -550) * bm;
        if (type === 'normal') sfxJump(charged);
    }
    player.setVelocityY(power);

    // Squash & stretch: la palla si schiaccia al rimbalzo (esagerato sulla molla)
    let sq = (type === 'spring') ? 1.45 : 1.25;
    player.squashing = true;
    player.setScale(sq, 2 - sq);
    this.tweens.add({
        targets: player,
        scaleX: 1, scaleY: 1,
        duration: 140, ease: 'Back.easeOut',
        onComplete: () => { player.squashing = false; }
    });

    if (type !== 'fragile') {
        this.tweens.add({ targets: platform, y: platform.y + 2, duration: 50, yoyo: true });
    }
}

function spawnPlatform(scene, yPos) {
    // Centri 45-355: le piattaforme coprono da x=5 a x=395, così sotto i punti
    // di wrap (x=0 e x=400) c'è sempre terreno su cui atterrare
    let x = Phaser.Math.Between(45, 355);

    // Tipo: la varieta' cresce con l'altezza (pool pesato)
    let climbed = 570 - yPos;
    let pool = ['normal', 'normal', 'normal', 'normal', 'normal', 'normal'];
    if (climbed > 500) pool.push('fragile', 'fragile');
    if (climbed > 900) pool.push('spring');
    if (climbed > 1200) { pool.push('moving', 'wobbly'); }
    let type = pool[Math.floor(Math.random() * pool.length)];

    // CHECKPOINT: ogni CHECKPOINT_INTERVAL px saliti, una piattaforma diventa checkpoint
    // La piattaforma più vicina alla multipla di CHECKPOINT_INTERVAL viene marcata
    let prevClimbed = climbed - SPAWN_GAP;
    let isCheckpoint = Math.floor(climbed / CHECKPOINT_INTERVAL) > Math.floor(prevClimbed / CHECKPOINT_INTERVAL);

    if (isCheckpoint) {
        type = 'normal'; // checkpoint è sempre piattaforma normale
    }

    let tex = (type === 'normal') ? 'platform' : 'plat_' + type;
    let platform = platforms.create(x, yPos, tex);
    platform.refreshBody();
    platform.setData({ type: type, baseX: x, t: Math.random() * Math.PI * 2, hits: 0, tilt: 0, dx: 0 });

    // Re-applica il pipeline in sicurezza se WebGL è attivo
    if (canUseGlow(scene)) {
        platform.setPostPipeline('GlowFX');
    }

    // CHECKPOINT: aggiunge la bandiera sopra la piattaforma
    if (isCheckpoint) {
        let cp = scene.physics.add.image(x, yPos - 28, 'checkpoint').setDepth(5);
        cp.body.setAllowGravity(false);
        cp.body.setImmovable(true);
        cp.setData('yPos', yPos);
        cp.setData('activated', false);
        checkpointPlatforms.add(cp);
        platform.setData('checkpoint', true);
        // Effetto glow pulsante
        scene.tweens.add({
            targets: cp,
            scaleX: 1.1, scaleY: 1.1,
            duration: 600,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
        });
    }

    if (Math.random() < 0.35) {
        let coin = coins.create(x, yPos - 35, 'coin');
        coin.body.setAllowGravity(false);
        scene.tweens.add({
            targets: coin,
            y: coin.y - 5,
            duration: 1000,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
        });
    }

    if (score > 1000 && yPos < -1400 && Math.random() < 0.25) {
        let enemy = enemies.create(x, yPos - 35, 'enemy');
        enemy.body.setAllowGravity(false);
        enemy.setVelocityX(Phaser.Math.Between(60, 120) * (Math.random() < 0.5 ? 1 : -1));
        enemy.setBounce(1);
    }
}

function collectCoin(player, coin) {
    coin.destroy();
    score += 500;
    runCoins++;
    updateScoreText();
    creditsHud.setText('CREDITS: ' + (credits + runCoins));
    sfxCoin();
    this.tweens.add({ targets: scoreText, scale: 1.1, duration: 100, yoyo: true });
}

// ---------- CHECKPOINT ----------
function activateCheckpoint(player, checkpoint) {
    if (checkpoint.getData('activated')) return;
    checkpoint.setData('activated', true);

    let cpY = checkpoint.getData('yPos');
    respawnCheckpointY = cpY;

    // Aggiorna il checkpoint più alto raggiunto
    let climbed = 570 - cpY;
    if (climbed > highestCheckpointY) {
        highestCheckpointY = climbed;
        saveCheckpoints();
    }

    // Feedback visivo: la bandiera cambia colore (diventa attiva)
    checkpoint.setTint(0x00ff9d);
    checkpoint.setScale(1.3);
    this.tweens.add({
        targets: checkpoint,
        scaleX: 1.0, scaleY: 1.0,
        duration: 300,
        ease: 'Back.easeOut'
    });

    // Flash + suono
    this.cameras.main.flash(200, 0, 255, 150);
    beep(880, 0.15, 'sine', 0.08, 1760);

    // Mostra testo "CHECKPOINT!"
    let txt = this.add.text(player.x, player.y - 40, 'CHECKPOINT!', {
        fontSize: '14px', fill: '#00ff9d', fontFamily: 'Courier New, monospace', fontStyle: 'bold',
        stroke: '#000000', strokeThickness: 2
    }).setOrigin(0.5).setDepth(100);
    this.tweens.add({
        targets: txt,
        y: txt.y - 30, alpha: 0,
        duration: 1000,
        onComplete: () => txt.destroy()
    });
}

function respawnAtCheckpoint(scene) {
    // Penalità: perdi metà delle monete della run corrente
    let penalty = Math.floor(runCoins / 2);
    runCoins -= penalty;
    if (runCoins < 0) runCoins = 0;

    // Teletrasporto al checkpoint
    player.setPosition(200, respawnCheckpointY - 30);
    player.setVelocity(0, 0);
    bestY = respawnCheckpointY - 30;

    // Aggiorna HUD
    creditsHud.setText('CREDITS: ' + (credits + runCoins));

    // Feedback visivo
    scene.cameras.main.flash(300, 255, 100, 0);
    scene.cameras.main.centerOn(200, respawnCheckpointY - 30);
    beep(330, 0.2, 'sawtooth', 0.06, 110);

    // Testo "RESPAWN!"
    let txt = scene.add.text(200, respawnCheckpointY - 60, 'RESPAWN!' + (penalty > 0 ? ' (-' + penalty + ' CR)' : ''), {
        fontSize: '16px', fill: '#ff9d00', fontFamily: 'Courier New, monospace', fontStyle: 'bold',
        stroke: '#000000', strokeThickness: 2
    }).setOrigin(0.5).setDepth(100);
    scene.tweens.add({
        targets: txt,
        y: txt.y - 30, alpha: 0,
        duration: 1200,
        onComplete: () => txt.destroy()
    });
}

function hitEnemy(player, enemy) {
    // SHIELD: assorbe il colpo, distrugge il nemico e consuma una carica
    if (shieldCharges > 0) {
        shieldCharges--;
        enemy.destroy();
        beep(440, 0.15, 'triangle', 0.07, 220);
        this.cameras.main.flash(150, 255, 255, 255);
        return;
    }
    triggerGameOver(this, 'HACKERATO!');
}

function triggerGameOver(scene, reason) {
    gameOver = true;
    scene.physics.pause();
    savePersisted();
    sfxDeath();

    // Le monete raccolte nella run diventano crediti permanenti
    let earned = runCoins;
    credits += earned;
    runCoins = 0;
    saveUpgrades();

    // Ferma la musica boss: resetta il loop alla traccia normale
    bossActive = false;
    songQueue = ['A', 'A', 'B', 'B']; queuePos = 0; sectionStep = 0;

    trailEmitter.stop();
    player.setVisible(false);
    if (shieldRing) shieldRing.clear();

    // Nasconde il mondo di gioco: lo shop legge bene su fondo pulito
    platforms.setVisible(false);
    coins.setVisible(false);
    enemies.setVisible(false);
    if (ghostLine) ghostLine.setVisible(false);
    if (ghostText) ghostText.setVisible(false);
    creditsHud.setVisible(false);

    deathEmitter.emitParticleAt(player.x, player.y, 20);

    let overlay = scene.add.graphics().setScrollFactor(0);
    overlay.fillStyle(0x020617, 0.97);
    overlay.fillRect(0, 0, 400, 600);

    scene.add.text(200, 80, 'SISTEMA COMPROMESSO', {
        fontSize: '24px', fill: C_RED_CSS, fontFamily: 'Courier New, monospace', fontStyle: 'bold'
    }).setOrigin(0.5).setScrollFactor(0);

    scene.add.text(200, 116, reason, {
        fontSize: '15px', fill: '#ffffff', fontFamily: 'Courier New, monospace'
    }).setOrigin(0.5).setScrollFactor(0);

    scene.add.text(200, 150, 'Punteggio: ' + score, {
        fontSize: '18px', fill: C_CYAN_CSS, fontFamily: 'Courier New, monospace'
    }).setOrigin(0.5).setScrollFactor(0);

    scene.add.text(200, 186, 'MONETE CONVERTITE: +' + earned + ' CR', {
        fontSize: '13px', fill: C_YELLOW_CSS, fontFamily: 'Courier New, monospace'
    }).setOrigin(0.5).setScrollFactor(0);

    // Shop upgrade: spendi i crediti prima di rigiocare
    showShop(scene);
}

// ---------- STATS OVERLAY ----------
function toggleStats(scene) {
    if (gameOver) return;
    statsVisible = !statsVisible;
    if (statsVisible) {
        scene.physics.pause();
        drawStats(scene);
    } else {
        statsObjs.forEach(o => o.destroy());
        statsObjs = [];
        scene.physics.resume();
    }
}

function drawStats(scene) {
    // Pannello centrato compatto (non a tutto schermo)
    let panelW = 340, panelH = 480;
    let px = (400 - panelW) / 2;
    let py = (600 - panelH) / 2;

    let bg = scene.add.graphics().setScrollFactor(0).setDepth(100);
    bg.fillStyle(0x020617, 0.97);
    bg.fillRoundedRect(px, py, panelW, panelH, 8);
    bg.lineStyle(2, 0x00f0ff, 0.6);
    bg.strokeRoundedRect(px, py, panelW, panelH, 8);
    statsObjs.push(bg);

    let cy = py + 35;
    let title = scene.add.text(200, cy, 'STATS', {
        fontSize: '24px', fill: C_CYAN_CSS, fontFamily: 'Courier New, monospace', fontStyle: 'bold'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(101);
    statsObjs.push(title);
    cy += 35;

    let bhText = scene.add.text(200, cy, 'BEST HEIGHT: ' + Math.floor(bestHeight) + 'px', {
        fontSize: '15px', fill: '#ffffff', fontFamily: 'Courier New, monospace'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(101);
    statsObjs.push(bhText);
    cy += 35;

    let bossTitle = scene.add.text(200, cy, 'BOSS SCONFITTI', {
        fontSize: '16px', fill: C_YELLOW_CSS, fontFamily: 'Courier New, monospace', fontStyle: 'bold'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(101);
    statsObjs.push(bossTitle);
    cy += 30;

    if (bossIndex === 0) {
        let noneText = scene.add.text(200, cy, 'NESSUN BOSS SCONFITTO', {
            fontSize: '13px', fill: '#666666', fontFamily: 'Courier New, monospace'
        }).setOrigin(0.5).setScrollFactor(0).setDepth(101);
        statsObjs.push(noneText);
        cy += 30;
    } else {
        for (let i = 0; i < bossIndex && i < BOSSES.length; i++) {
            let b = BOSSES[i];
            let badge = scene.add.graphics().setScrollFactor(0).setDepth(101);
            drawMiniBoss(badge, px + 35, cy, b.key);
            statsObjs.push(badge);

            let nameText = scene.add.text(px + 65, cy - 8, b.key, {
                fontSize: '13px', fill: '#ffffff', fontFamily: 'Courier New, monospace', fontStyle: 'bold'
            }).setScrollFactor(0).setDepth(101);
            statsObjs.push(nameText);

            let hpText = scene.add.text(px + 65, cy + 8, 'HP:' + b.hp + '  H:' + b.height + 'px', {
                fontSize: '10px', fill: '#aaaaaa', fontFamily: 'Courier New, monospace'
            }).setScrollFactor(0).setDepth(101);
            statsObjs.push(hpText);

            cy += 40;
        }
    }

    cy += 10;
    let upTitle = scene.add.text(200, cy, 'UPGRADE', {
        fontSize: '15px', fill: C_CYAN_CSS, fontFamily: 'Courier New, monospace', fontStyle: 'bold'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(101);
    statsObjs.push(upTitle);
    cy += 28;

    UPGRADES.forEach(u => {
        let lvl = upLevels[u.key] || 0;
        let upText = scene.add.text(200, cy, u.name + ' Lv.' + lvl + '/' + u.max, {
            fontSize: '12px', fill: lvl > 0 ? C_YELLOW_CSS : '#666666', fontFamily: 'Courier New, monospace'
        }).setOrigin(0.5).setScrollFactor(0).setDepth(101);
        statsObjs.push(upText);
        cy += 20;
    });

    // Checkpoint stats
    cy += 10;
    let cpText = scene.add.text(200, cy, 'CHECKPOINT: ' + Math.floor(highestCheckpointY) + 'px', {
        fontSize: '12px', fill: '#00ff9d', fontFamily: 'Courier New, monospace'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(101);
    statsObjs.push(cpText);

    let closeText = scene.add.text(200, py + panelH - 20, 'PREMI S PER CHIUDERE', {
        fontSize: '11px', fill: '#888888', fontFamily: 'Courier New, monospace'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(101);
    statsObjs.push(closeText);
}

function drawMiniBoss(g, x, y, key) {
    g.lineStyle(2, 0xffffff, 1);
    switch (key) {
        case 'GLITCH':
            g.fillStyle(0xff0033, 0.4);
            g.fillRoundedRect(x - 12, y - 12, 24, 24, 3);
            g.strokeRoundedRect(x - 12, y - 12, 24, 24, 3);
            break;
        case 'FIREWALL':
            g.fillStyle(0xff9d00, 0.4);
            g.fillRect(x - 14, y - 6, 28, 12);
            g.strokeRect(x - 14, y - 6, 28, 12);
            break;
        case 'MALWARE':
            g.fillStyle(0x9d00ff, 0.4);
            g.fillCircle(x, y, 12);
            g.strokeCircle(x, y, 12);
            break;
        case 'TROJAN':
            g.fillStyle(0xff0033, 0.4);
            g.fillTriangle(x, y - 12, x + 12, y + 10, x - 12, y + 10);
            g.strokeTriangle(x, y - 12, x + 12, y + 10, x - 12, y + 10);
            break;
        case 'WORM':
            g.fillStyle(0x00ff9d, 0.4);
            for (let i = 0; i < 4; i++) {
                g.fillCircle(x - 9 + i * 6, y, 5);
                g.strokeCircle(x - 9 + i * 6, y, 5);
            }
            break;
        case 'DDOS':
            g.fillStyle(0x00b3ff, 0.4);
            g.fillCircle(x, y, 8);
            g.strokeCircle(x, y, 8);
            for (let i = 0; i < 4; i++) {
                let angle = (i * Math.PI) / 2;
                g.fillCircle(x + Math.cos(angle) * 12, y + Math.sin(angle) * 12, 3);
            }
            break;
        case 'RANSOMWARE':
            g.fillStyle(0xffd700, 0.4);
            g.fillRoundedRect(x - 8, y - 10, 16, 14, 2);
            g.strokeRoundedRect(x - 8, y - 10, 16, 14, 2);
            g.lineStyle(2, 0xff0033, 1);
            g.beginPath();
            g.arc(x, y - 10, 5, Math.PI, 0);
            g.strokePath();
            break;
        case 'DATALOSS':
            g.fillStyle(0x000000, 0.8);
            g.fillCircle(x, y, 14);
            g.lineStyle(2, 0x00f0ff, 1);
            g.strokeCircle(x, y, 14);
            break;
        case 'ROOTKIT':
            g.fillStyle(0xaaaaaa, 0.3);
            g.fillCircle(x, y, 12);
            g.strokeCircle(x, y, 12);
            break;
        case 'AI':
            g.fillStyle(0xff00ff, 0.4);
            g.fillTriangle(x, y - 12, x + 12, y + 8, x - 12, y + 8);
            g.strokeTriangle(x, y - 12, x + 12, y + 8, x - 12, y + 8);
            g.lineStyle(1, 0x00ffff, 1);
            g.strokeCircle(x, y, 14);
            break;
        default:
            g.fillStyle(0x666666, 0.4);
            g.fillCircle(x, y, 10);
            g.strokeCircle(x, y, 10);
    }
}
